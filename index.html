<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アフリカ白地図クイズ - Africa Map Quiz</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- D3.js & TopoJSON -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <!-- Google Fonts (Noto Sans JP & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      height: 100dvh;
      max-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
      color: #1e293b;
      overscroll-behavior: none;
    }

    #map-container {
      background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
      touch-action: none; /* D3ズームとブラウザスクロールの競合防止 */
    }

    /* 背景の非対象地域（西サハラなど） */
    .country-context {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 0.5px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* 出題対象国の基本スタイル（未出題） */
    .country-path {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 0.65px;
      stroke-linejoin: round;
      transition: fill 0.25s ease, stroke 0.25s ease;
    }

    .country-path:hover {
      fill: #f8fafc;
    }

    /* 出題対象国のハイライト */
    .country-target {
      fill: #f97316 !important;
      stroke: #9a3412 !important;
      stroke-width: 1.25px !important;
      filter: drop-shadow(0 2px 6px rgba(249, 115, 22, 0.45));
    }

    /* 正解した国 */
    .country-correct {
      fill: #10b981 !important;
      stroke: #047857 !important;
    }

    /* 不正解だった国 */
    .country-incorrect {
      fill: #f43f5e !important;
      stroke: #be123c !important;
    }

    /* 小さな島国用の視認補助サークル */
    .island-marker {
      fill: #ffffff;
      stroke: #64748b;
      stroke-width: 1px;
      transition: fill 0.25s ease, stroke 0.25s ease;
    }

    .island-marker.country-target {
      fill: #f97316 !important;
      stroke: #9a3412 !important;
      stroke-width: 1.5px !important;
    }

    .island-marker.country-correct {
      fill: #10b981 !important;
      stroke: #047857 !important;
    }

    .island-marker.country-incorrect {
      fill: #f43f5e !important;
      stroke: #be123c !important;
    }

    /* すべての出題国の重心に表示する波紋（パルスリング）アニメーション */
    @keyframes rippleExpand {
      0% {
        transform: scale(0.45);
        opacity: 0.95;
      }
      100% {
        transform: scale(3.2);
        opacity: 0;
      }
    }

    .target-ripple {
      transform-box: fill-box;
      transform-origin: center;
      animation: rippleExpand 1.9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }

    .target-ripple-delayed {
      transform-box: fill-box;
      transform-origin: center;
      animation: rippleExpand 1.9s cubic-bezier(0.16, 1, 0.3, 1) 0.95s infinite;
      pointer-events: none;
    }

    /* 答え表示のフェードインアニメーション */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-pop-in {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-[100dvh] max-h-[100dvh] overflow-hidden flex flex-col select-none">

  <!-- コンパクトヘッダー（1行完結・高さ約44px） -->
  <header class="shrink-0 h-11 bg-white border-b border-slate-200 z-20 px-2.5 sm:px-4 flex items-center justify-between gap-1.5">
    <!-- 左側：短縮タイトル＆地域フィルター -->
    <div class="flex items-center gap-1.5 min-w-0">
      <div class="w-6 h-6 shrink-0 rounded-lg bg-brand-500 text-white flex items-center justify-center">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-xs sm:text-sm font-extrabold text-slate-800 tracking-tight truncate">アフリカ白地図</h1>

      <!-- 地域フィルター -->
      <div class="relative shrink-0">
        <select id="region-filter" aria-label="地域別フィルター" class="appearance-none bg-slate-100 border border-slate-200 text-slate-700 text-[11px] sm:text-xs font-bold rounded-lg pl-2 pr-5 py-0.5 focus:outline-none focus:ring-1 focus:ring-brand-500 cursor-pointer">
          <option value="all">全54カ国</option>
          <option value="north">北アフリカ</option>
          <option value="west">西アフリカ</option>
          <option value="central">中部アフリカ</option>
          <option value="east">東アフリカ</option>
          <option value="south">南部アフリカ</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-1 flex items-center text-slate-500">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- 右側：正答スコア・進捗・リセット -->
    <div class="flex items-center gap-1.5 shrink-0 text-[11px] sm:text-xs">
      <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200/80 px-2 py-0.5 rounded-lg font-bold">
        <span class="text-emerald-600">〇<span id="correct-count-text">0</span></span>
        <span class="text-rose-500">✕<span id="incorrect-count-text">0</span></span>
        <span class="text-slate-300">|</span>
        <span id="question-number" class="text-slate-700">1/54</span>
      </div>

      <button id="btn-reset-progress" class="px-2 py-0.5 rounded-lg border border-slate-200 text-slate-500 hover:text-rose-600 hover:bg-rose-50 font-semibold transition" title="最初からリセット">
        リセット
      </button>
    </div>
  </header>

  <!-- メインエリア（残り高さすべてを地図＋コンパクトボトムパネルで分割） -->
  <main class="flex-1 min-h-0 flex flex-col lg:flex-row max-w-6xl w-full mx-auto overflow-hidden">
    
    <!-- 地図エリア（残り高さを最大限確保） -->
    <div id="map-container" class="relative flex-1 min-h-0 w-full overflow-hidden flex items-center justify-center">
      
      <!-- ローディングスピナー -->
      <div id="loading-overlay" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center gap-2">
        <div class="w-8 h-8 border-3 border-slate-200 border-t-brand-500 rounded-full animate-spin"></div>
        <p class="text-xs font-medium text-slate-600">アフリカ全54カ国の地図を読み込み中...</p>
      </div>

      <!-- エラー表示 -->
      <div id="error-overlay" class="hidden absolute inset-0 bg-white z-10 flex flex-col items-center justify-center p-4 text-center gap-2">
        <h3 class="text-sm font-bold text-slate-800">地図データの読み込みに失敗しました</h3>
        <p id="error-message" class="text-xs text-slate-500">ネットワーク接続を確認して再試行してください。</p>
        <button onclick="location.reload()" class="mt-1 px-3 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-lg">
          再読み込み
        </button>
      </div>

      <!-- SVG描画領域 -->
      <svg id="africa-map" class="w-full h-full cursor-grab active:cursor-grabbing"></svg>

      <!-- 復習モードバッジ（左上） -->
      <div id="review-mode-badge" class="hidden absolute top-2 left-2 bg-rose-600 text-white px-2.5 py-0.5 rounded-full shadow text-[11px] font-bold flex items-center gap-1 z-10">
        <span>復習モード</span>
      </div>

      <!-- オプション：自動ズーム切替（右上） -->
      <label class="absolute top-2 right-2 bg-white/85 backdrop-blur-xs px-2 py-1 rounded-lg border border-slate-200/80 shadow-xs text-[10px] sm:text-[11px] text-slate-600 font-medium inline-flex items-center gap-1 cursor-pointer z-10">
        <input type="checkbox" id="chk-auto-zoom" checked class="rounded text-brand-500 focus:ring-brand-500 w-3 h-3">
        <span>小国自動ズーム</span>
      </label>

      <!-- 極小凡例＆ズームリセット（右下） -->
      <div class="absolute bottom-2 right-2 flex items-center gap-1.5 z-10">
        <div class="bg-white/85 backdrop-blur-xs px-2 py-1 rounded-lg border border-slate-200/80 shadow-xs text-[10px] text-slate-600 flex items-center gap-2 pointer-events-none">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-[#f97316] inline-block"></span>対象</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-[#10b981] inline-block"></span>正解</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-[#f43f5e] inline-block"></span>不正解</span>
        </div>

        <button id="btn-reset-view" class="w-7 h-7 bg-white/90 hover:bg-white backdrop-blur-xs rounded-lg border border-slate-200 shadow-xs text-slate-700 font-bold text-sm flex items-center justify-center active:scale-95 transition" title="表示をリセット" aria-label="表示をリセット">
          ⟲
        </button>
      </div>
    </div>

    <!-- コンパクトボトム操作パネル（縦幅を抑えて1画面にぴったり収める） -->
    <div class="shrink-0 w-full lg:w-[360px] bg-white border-t lg:border-t-0 lg:border-l border-slate-200 px-3 py-2.5 sm:p-4 flex flex-col justify-between gap-2 z-10">
      
      <!-- 答え表示エリア（コンパクト1〜2行表示・高さ固定気味で跳ね上がりを防止） -->
      <div id="answer-card" class="h-[72px] sm:h-[88px] rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 flex flex-col justify-center overflow-hidden">
        <!-- 答え表示前：シンプルなプレースホルダー＆ヒントボタン -->
        <div id="answer-placeholder" class="flex items-center justify-between gap-2">
          <div id="hint-box" class="text-xs text-slate-500 truncate">
            <span class="text-slate-400">タップして国名を確認</span>
          </div>
          <button id="btn-toggle-hint" class="shrink-0 px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200/80 text-amber-800 text-[11px] font-bold transition">
            ヒントを見る
          </button>
        </div>

        <!-- 答え表示後：国名・首都・地域・短い豆知識をコンパクトに表示 -->
        <div id="answer-content" class="hidden w-full animate-pop-in">
          <div class="flex items-baseline justify-between gap-2">
            <div class="flex items-baseline gap-1.5 min-w-0">
              <h2 id="answer-ja" class="text-lg sm:text-xl font-extrabold text-slate-900 truncate">国名</h2>
              <span id="answer-en" class="text-[11px] font-semibold text-brand-600 truncate">Country</span>
            </div>
            <span class="shrink-0 text-[11px] font-bold text-slate-600 bg-white px-2 py-0.5 rounded-md border border-slate-200">
              <span id="answer-region">地域</span>・首都:<span id="answer-capital">首都</span>
            </span>
          </div>
          <p id="answer-trivia" class="text-[11px] text-slate-600 truncate mt-1">豆知識</p>
        </div>
      </div>

      <!-- アクションボタン行 -->
      <div class="flex items-center gap-2">
        <!-- 前の問題に戻るボタン（常時アクセス可能） -->
        <button id="btn-prev-question" disabled class="shrink-0 h-11 px-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center gap-1 disabled:opacity-35 disabled:pointer-events-none active:scale-95 transition" title="前の問題に戻る (Backspace / Z)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"></path>
          </svg>
          <span>戻る</span>
        </button>

        <!-- 1. 答えを表示ボタン（回答前） -->
        <button id="btn-show-answer" class="flex-1 h-11 bg-brand-500 hover:bg-brand-600 active:scale-[0.99] text-white font-bold rounded-xl shadow-sm shadow-brand-500/20 transition flex items-center justify-center gap-1.5 text-sm sm:text-base">
          <span>答えを表示</span>
        </button>

        <!-- 2. 自己採点ボタン群（答え表示後に表示） -->
        <div id="self-grade-buttons" class="hidden flex-1 grid grid-cols-2 gap-2">
          <button id="btn-mark-incorrect" class="h-11 px-2 bg-rose-500 hover:bg-rose-600 active:scale-[0.98] text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-1 text-xs sm:text-sm" title="不正解として記録">
            <span>✕ 不正解</span>
          </button>

          <button id="btn-mark-correct" class="h-11 px-2 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-1 text-xs sm:text-sm" title="正解として記録">
            <span>〇 正解</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- ラウンド終了・リザルトモーダル -->
  <div id="complete-modal" class="hidden fixed inset-0 bg-slate-900/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 text-center shadow-2xl animate-pop-in max-h-[90vh] overflow-y-auto">
      <div id="modal-icon-bg" class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h3 id="modal-title" class="text-2xl font-extrabold text-slate-800 mb-1">ラウンド終了！</h3>
      <p id="modal-subtitle" class="text-xs text-slate-500 mb-5">お疲れさまでした！今回の学習結果です。</p>

      <!-- スコアサマリーカード -->
      <div class="grid grid-cols-3 gap-2 bg-slate-50 border border-slate-200/80 rounded-2xl p-3.5 mb-4">
        <div>
          <span class="block text-[11px] text-slate-400 font-medium">正解数</span>
          <span id="result-correct" class="text-xl font-extrabold text-emerald-600">0</span>
        </div>
        <div class="border-x border-slate-200">
          <span class="block text-[11px] text-slate-400 font-medium">不正解</span>
          <span id="result-incorrect" class="text-xl font-extrabold text-rose-500">0</span>
        </div>
        <div>
          <span class="block text-[11px] text-slate-400 font-medium">正答率</span>
          <span id="result-rate" class="text-xl font-extrabold text-slate-800">0%</span>
        </div>
      </div>

      <!-- 不正解だった国の一覧（不正解がある場合のみ表示） -->
      <div id="incorrect-list-wrapper" class="hidden text-left mb-5">
        <p class="text-xs font-bold text-slate-600 mb-1.5">不正解だった国：</p>
        <div id="incorrect-countries-list" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-2.5 bg-rose-50/60 border border-rose-100 rounded-xl">
          <!-- JSでバッジを生成 -->
        </div>
      </div>

      <div class="space-y-2.5">
        <!-- 前回不正解問題のみで再挑戦ボタン（不正解がある場合のみ表示） -->
        <button id="btn-retry-incorrect" class="hidden w-full py-3.5 px-4 bg-rose-500 hover:bg-rose-600 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-rose-500/25 transition flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span>前回不正解だった問題のみで再挑戦（<span id="retry-incorrect-count">0</span>問）</span>
        </button>

        <!-- 選択中の地域で最初からプレイ -->
        <button id="btn-restart-current-region" class="hidden w-full py-3 px-4 bg-brand-500 hover:bg-brand-600 active:scale-[0.99] text-white font-bold rounded-xl transition">
          この地域でもう一度プレイする
        </button>

        <!-- 全54カ国で最初からプレイボタン -->
        <button id="btn-restart-all" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-900 active:scale-[0.99] text-white font-bold rounded-xl transition">
          全54カ国で最初からプレイ
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * アフリカ州の全54カ国マスターデータ (ISO 3166-1 numericコードをキーとする)
     * regionKey: 'north' | 'west' | 'central' | 'east' | 'south'
     */
    const AFRICA_COUNTRIES = {
      "012": { ja: "アルジェリア", en: "Algeria", capital: "アルジェ", region: "北アフリカ", regionKey: "north", trivia: "アフリカ大陸で最大の面積を持つ国で、国土の8割以上をサハラ砂漠が占めています。" },
      "024": { ja: "アンゴラ", en: "Angola", capital: "ルアンダ", region: "中部アフリカ", regionKey: "central", trivia: "石油やダイヤモンドなどの天然資源が豊富で、公用語はポルトガル語です。" },
      "204": { ja: "ベナン", en: "Benin", capital: "ポルトノボ", region: "西アフリカ", regionKey: "west", trivia: "ブードゥー教発祥の地として知られ、縦に細長い国土を持っています。" },
      "072": { ja: "ボツワナ", en: "Botswana", capital: "ハボローネ", region: "南部アフリカ", regionKey: "south", trivia: "世界有数のダイヤモンド産出国で、オカバンゴ・デルタなど豊かな自然が残ります。" },
      "854": { ja: "ブルキナファソ", en: "Burkina Faso", capital: "ワガドゥグー", region: "西アフリカ", regionKey: "west", trivia: "国名は現地語で「高潔な人々の国」を意味する西アフリカの内陸国です。" },
      "108": { ja: "ブルンジ", en: "Burundi", capital: "ギテガ", region: "東アフリカ", regionKey: "east", trivia: "タンガニーカ湖の北東に位置する小さな内陸国で、コーヒー栽培が盛んです。", small: true },
      "132": { ja: "カーボベルデ", en: "Cabo Verde", capital: "プライア", region: "西アフリカ（島国）", regionKey: "west", trivia: "大西洋上のマカロネシア地域に浮かぶ10の主要な火山島からなる島国です。", small: true, island: true, coords: [-23.6, 15.1] },
      "120": { ja: "カメルーン", en: "Cameroon", capital: "ヤウンデ", region: "中部アフリカ", regionKey: "central", trivia: "多様な気候と地形を持つことから「アフリカの縮図」とも呼ばれます。" },
      "140": { ja: "中央アフリカ共和国", en: "Central African Republic", capital: "バンギ", region: "中部アフリカ", regionKey: "central", trivia: "文字通りアフリカ大陸のほぼ中央に位置する内陸国です。" },

    /**
     * 初期化処理
     */
    async function init() {
      setupEventListeners();
      await loadMapData();
    }

    /**
     * 高精細TopoJSON (countries-50m.json) を読み込み、
     * ソマリランドのソマリア統合およびアフリカ全54カ国（島国含む）＋背景地域を構築する
     */
    async function loadMapData() {
      try {
        const url = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json';
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status}`);
        }
        const worldData = await response.json();
        const allCountries = topojson.feature(worldData, worldData.objects.countries).features;

        // 1. ソマリア（706）とソマリランド（IDなし・Somaliland）を統合してソマリアの形を完全に復元
        const somaliaFeatures = allCountries.filter(f => {
          const idStr = f.id ? String(f.id).padStart(3, '0') : '';
          const name = (f.properties && f.properties.name) ? f.properties.name.toLowerCase() : '';
          if (idStr === '706' || name.includes('somaliland') || name === 'somalia') {
            return true;
          }
          if (!f.id) {
            const c = d3.geoCentroid(f);
            if (c[0] > 42 && c[0] < 52 && c[1] > 7 && c[1] < 12) {
              return true;
            }
          }
          return false;
        });

        let mergedSomaliaGeometry = null;
        if (somaliaFeatures.length > 0) {
          const polygons = [];
          somaliaFeatures.forEach(f => {
            if (f.geometry.type === 'Polygon') {
              polygons.push(f.geometry.coordinates);
            } else if (f.geometry.type === 'MultiPolygon') {
              polygons.push(...f.geometry.coordinates);
            }
          });
          mergedSomaliaGeometry = {
            type: 'MultiPolygon',
            coordinates: polygons
          };
        }

        // 2. マスターデータに定義された54カ国のフィーチャをマッピング＆西サハラなどの背景地域抽出
        const featureMap = new Map();
        const contextList = [];

        allCountries.forEach(f => {
          const idStr = f.id ? String(f.id).padStart(3, '0') : '';
          if (AFRICA_COUNTRIES[idStr]) {
            if (idStr === '706' && mergedSomaliaGeometry) {
              featureMap.set('706', {
                type: 'Feature',
                id: '706',
                normalizedId: '706',
                properties: f.properties,
                geometry: mergedSomaliaGeometry
              });
            } else {
              f.normalizedId = idStr;
              featureMap.set(idStr, f);
            }
          } else if (idStr === '732') {
            // 西サハラ (732) は大陸形状維持のため背景ポリゴンとして描画
            contextList.push(f);
          }
        });

        // 3. 万が一50mデータに含まれない島国がある場合は緯度経度から補完フィーチャを生成
        Object.keys(AFRICA_COUNTRIES).forEach(idStr => {
          if (!featureMap.has(idStr)) {
            const info = AFRICA_COUNTRIES[idStr];
            if (info.coords) {
              const circleGeo = d3.geoCircle().center(info.coords).radius(0.45)();
              featureMap.set(idStr, {
                type: 'Feature',
                id: idStr,
                normalizedId: idStr,
                properties: { name: info.en },
                geometry: circleGeo
              });
            }
          }
        });

        state.features = Array.from(featureMap.values());
        state.contextFeatures = contextList;

        if (state.features.length === 0) {
          throw new Error('アフリカ諸国の地図データが見つかりませんでした。');
        }

        renderMap();
        startNewRound(null);
        els.loading.classList.add('hidden');

      } catch (err) {
        console.error('地図読み込みエラー:', err);
        els.loading.classList.add('hidden');
        els.errorMsg.textContent = err.message || '地図データの取得に失敗しました。';
        els.error.classList.remove('hidden');
      }
    }

    /**
     * D3.jsでアフリカ大陸＋周辺島国のSVG白地図を描画
     */
    function renderMap() {
      const rect = els.mapContainer.getBoundingClientRect();
      state.width = rect.width || 600;
      state.height = rect.height || 500;

      state.svg = d3.select('#africa-map')
        .attr('viewBox', `0 0 ${state.width} ${state.height}`)
        .attr('preserveAspectRatio', 'xMidYMid meet');

      state.svg.selectAll('*').remove();

      state.g = state.svg.append('g');

      const africaCollection = {
        type: 'FeatureCollection',
        features: [...state.features, ...state.contextFeatures]
      };

      const padding = 28;
      state.projection = d3.geoMercator()
        .fitExtent([[padding, padding], [state.width - padding, state.height - padding]], africaCollection);

      state.pathGenerator = d3.geoPath().projection(state.projection);

      // 地図全体のバウンディングボックスを計算し、スクロール（パン）限界を設定
      const bounds = state.pathGenerator.bounds(africaCollection);
      const marginX = state.width * 0.42;
      const marginY = state.height * 0.42;

      state.zoom = d3.zoom()
        .scaleExtent([0.85, 8])
        .translateExtent([
          [bounds[0][0] - marginX, bounds[0][1] - marginY],
          [bounds[1][0] + marginX, bounds[1][1] + marginY]
        ])
        .on('zoom', (event) => {
          state.g.attr('transform', event.transform);
          const k = event.transform.k;
          const strokeWidth = Math.max(0.15, 0.65 / k);
          state.g.selectAll('.country-path').style('stroke-width', `${strokeWidth}px`);
          state.g.selectAll('.country-context').style('stroke-width', `${Math.max(0.12, 0.5 / k)}px`);
          state.g.selectAll('.island-marker')
            .attr('r', Math.max(2.5, 6.5 / Math.pow(k, 0.65)))
            .style('stroke-width', `${Math.max(0.3, 1.1 / k)}px`);
        });

      state.svg.call(state.zoom);

      // 1. 背景の非対象地域（西サハラなど）を描画
      state.g.selectAll('.country-context')
        .data(state.contextFeatures)
        .enter()
        .append('path')
        .attr('class', 'country-context')
        .attr('d', state.pathGenerator);

      // 2. 出題対象54カ国のパスを描画
      state.g.selectAll('.country-path')
        .data(state.features)
        .enter()
        .append('path')
        .attr('class', 'country-path')
        .attr('id', d => `country-${d.normalizedId}`)
        .attr('d', state.pathGenerator);

      // 3. 小さな島国用の補助円マーカー層
      const islandLayer = state.g.append('g').attr('id', 'island-layer');
      const islandFeatures = state.features.filter(f => AFRICA_COUNTRIES[f.normalizedId]?.island);

      islandLayer.selectAll('.island-marker')
        .data(islandFeatures)
        .enter()
        .append('circle')
        .attr('class', 'island-marker')
        .attr('id', d => `island-marker-${d.normalizedId}`)
        .attr('cx', d => getCountryCenterPoint(d)[0])
        .attr('cy', d => getCountryCenterPoint(d)[1])
        .attr('r', 6.5);

      // 4. すべての出題国用の波紋アニメーション＆中心点レイヤー（最前面）
      state.g.append('g').attr('id', 'marker-layer');
    }

    /**
     * 国の重心スクリーン座標 [x, y] を取得する（島国用のcoords優先、なければpathGenerator.centroid）
     */
    function getCountryCenterPoint(feature) {
      const info = AFRICA_COUNTRIES[feature.normalizedId];
      if (info && info.coords) {
        return state.projection(info.coords);
      }
      const centroid = state.pathGenerator.centroid(feature);
      if (centroid && !isNaN(centroid[0]) && !isNaN(centroid[1])) {
        return centroid;
      }
      const geoCenter = d3.geoCentroid(feature);
      return state.projection(geoCenter);
    }

    /**
     * 新しいラウンドを開始する
     * @param {string[]|null} targetIdList - 指定された場合はそのIDリストのみ出題（復習モード）、nullなら地域フィルターに応じた全対象国
     */
    function startNewRound(targetIdList = null) {
      els.completeModal.classList.add('hidden');

      if (targetIdList && targetIdList.length > 0) {
        state.isReviewMode = true;
        state.sequence = shuffleArray([...targetIdList]);
        // 復習対象の国は一旦未回答状態（白）に戻して再テストする
        targetIdList.forEach(id => state.answers.delete(id));
        els.reviewModeBadge.classList.remove('hidden');
      } else {
        state.isReviewMode = false;
        state.answers.clear();
        els.reviewModeBadge.classList.add('hidden');

        // 地域フィルターに合致する国IDを抽出
        const filteredIds = state.features
          .map(f => f.normalizedId)
          .filter(id => {
            if (state.selectedRegion === 'all') return true;
            return AFRICA_COUNTRIES[id]?.regionKey === state.selectedRegion;
          });

        state.sequence = shuffleArray(filteredIds);
      }

      state.currentIndex = 0;
      loadQuestionAtIndex(0);
    }

    /**
     * 指定インデックスの問題を読み込み・表示する（前進・後退の両方に対応）
     */
    function loadQuestionAtIndex(index) {
      if (index < 0) return;

      // 全問終了した場合
      if (index >= state.sequence.length) {
        showRoundResultModal();
        return;
      }

      state.currentIndex = index;
      const currentId = state.sequence[index];
      state.isAnswerRevealed = false;

      // 「前の問題に戻る」ボタンの活性制御
      els.btnPrevQuestion.disabled = (index === 0);

      // 問題番号とUI初期化
      els.questionNumber.textContent = `${index + 1}/${state.sequence.length}`;
      els.hintBox.innerHTML = '<span class="text-slate-400">地域・首都のヒントを表示できます</span>';
      els.btnToggleHint.classList.remove('hidden');
      els.answerPlaceholder.classList.remove('hidden');
      els.answerContent.classList.add('hidden');
      els.btnShowAnswer.classList.remove('hidden');
      els.selfGradeButtons.classList.add('hidden');
      els.answerCard.className = 'h-[72px] sm:h-[88px] rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 flex flex-col justify-center overflow-hidden';

      // ヒント内容セット
      const info = AFRICA_COUNTRIES[currentId];
      els.hintBox.dataset.region = info.region;
      els.hintBox.dataset.capital = info.capital;

      // 地図のハイライト・色分け・全54カ国共通の波紋アニメーション更新
      updateMapColors(currentId);
      updateStatusUI();

      // オプション：小さな国なら自動でズーム、そうでなければ全体表示へ
      if (els.chkAutoZoom.checked && info.small) {
        focusOnCountry(currentId);
      } else {
        resetZoom(true);
      }
    }

    /**
     * 前の問題に戻る処理
     * 直前の問題の回答記録（正解／不正解の色とスコア）を巻き戻し、その問題から再挑戦できるようにする
     */
    function goToPreviousQuestion() {
      if (state.currentIndex <= 0) return;

      const prevIndex = state.currentIndex - 1;
      const prevCountryId = state.sequence[prevIndex];

      // 戻った先の国の前回回答ステータスをリセット（未回答状態に戻す）
      state.answers.delete(prevCountryId);

      // その問題番号へ戻る
      loadQuestionAtIndex(prevIndex);
    }

    /**
     * 地図上のすべての国・島国マーカーの色分けと、出題中の国の波紋（パルス）アニメーションを更新
     */
    function updateMapColors(targetId) {
      if (!state.g) return;

      // 1. 通常ポリゴンの色分け
      state.g.selectAll('.country-path')
        .classed('country-target', d => d.normalizedId === targetId)
        .classed('country-correct', d => d.normalizedId !== targetId && state.answers.get(d.normalizedId) === 'correct')
        .classed('country-incorrect', d => d.normalizedId !== targetId && state.answers.get(d.normalizedId) === 'incorrect');

      // 2. 島国補助サークルマーカーの色分け
      state.g.selectAll('.island-marker')
        .classed('country-target', d => d.normalizedId === targetId)
        .classed('country-correct', d => d.normalizedId !== targetId && state.answers.get(d.normalizedId) === 'correct')
        .classed('country-incorrect', d => d.normalizedId !== targetId && state.answers.get(d.normalizedId) === 'incorrect');

      // 対象国を最前面へ移動して境界線を綺麗に描画
      if (targetId) {
        const targetSelection = state.g.select(`#country-${targetId}`);
        if (!targetSelection.empty()) {
          targetSelection.raise();
        }
        const islandLayer = state.g.select('#island-layer');
        if (!islandLayer.empty()) {
          islandLayer.raise();
        }
        const targetMarker = state.g.select(`#island-marker-${targetId}`);
        if (!targetMarker.empty()) {
          targetMarker.raise();
        }
      }

      // 3. 波紋アニメーションレイヤーを最前面にしてクリア
      const markerLayer = state.g.select('#marker-layer');
      markerLayer.raise();
      markerLayer.selectAll('*').remove();

      if (!targetId) return;

      // 4. 【全54カ国共通】現在出題中の国の重心にオレンジ色の中心点と広がる波紋（2重パルスリング）を描画
      const targetFeature = state.features.find(f => f.normalizedId === targetId);
      if (targetFeature) {
        const center = getCountryCenterPoint(targetFeature);

        if (center && !isNaN(center[0]) && !isNaN(center[1])) {
          // 1つ目の波紋リング
          markerLayer.append('circle')
            .attr('cx', center[0])
            .attr('cy', center[1])
            .attr('r', 12)
            .attr('fill', 'none')
            .attr('stroke', '#ea580c')
            .attr('stroke-width', 2.2)
            .attr('class', 'target-ripple');

          // 2つ目の波紋リング（少し遅れて広がる）
          markerLayer.append('circle')
            .attr('cx', center[0])
            .attr('cy', center[1])
            .attr('r', 12)
            .attr('fill', 'none')
            .attr('stroke', '#f97316')
            .attr('stroke-width', 1.8)
            .attr('class', 'target-ripple-delayed');

          // 中心点のオレンジドット（白縁取り付きで大きな国の上でもくっきり見える）
          markerLayer.append('circle')
            .attr('cx', center[0])
            .attr('cy', center[1])
            .attr('r', 4.5)
            .attr('fill', '#ea580c')
            .attr('stroke', '#ffffff')
            .attr('stroke-width', 1.6)
            .style('pointer-events', 'none');
        }
      }
    }

    /**
     * 答え（国名・首都・豆知識）を表示する
     */
    function revealAnswer() {
      const currentId = state.sequence[state.currentIndex];
      if (!currentId || state.isAnswerRevealed) return;
      state.isAnswerRevealed = true;

      const info = AFRICA_COUNTRIES[currentId];
      els.answerEn.textContent = info.en;
      els.answerJa.textContent = info.ja;
      els.answerCapital.textContent = info.capital;
      els.answerRegion.textContent = info.region;
      els.answerTrivia.textContent = info.trivia;

      els.btnShowAnswer.classList.add('hidden');
      els.selfGradeButtons.classList.remove('hidden');

      els.answerPlaceholder.classList.add('hidden');
      els.answerContent.classList.remove('hidden');
      els.answerCard.className = 'h-[72px] sm:h-[88px] rounded-xl border border-brand-300 bg-brand-50/40 px-3 py-1.5 flex flex-col justify-center overflow-hidden';
    }

    /**
     * 自己採点処理（正解・不正解を記録して次の問題へ進む）
     */
    function recordSelfGrade(isCorrect) {
      const currentId = state.sequence[state.currentIndex];
      if (!currentId) return;

      state.answers.set(currentId, isCorrect ? 'correct' : 'incorrect');
      updateStatusUI();
      loadQuestionAtIndex(state.currentIndex + 1);
    }

    /**
     * ラウンド終了時のリザルトモーダル表示
     */
    function showRoundResultModal() {
      // 最後の問題の色も地図に反映させる
      updateMapColors(null);
      resetZoom(true);

      // 今ラウンドのsequence内の結果を集計
      let correctNum = 0;
      const incorrectIdsInRound = [];

      state.sequence.forEach(id => {
        const res = state.answers.get(id);
        if (res === 'correct') {
          correctNum++;
        } else if (res === 'incorrect') {
          incorrectIdsInRound.push(id);
        }
      });

      const incorrectNum = incorrectIdsInRound.length;
      const totalAnswered = correctNum + incorrectNum;
      const rate = totalAnswered > 0 ? Math.round((correctNum / totalAnswered) * 100) : 0;

      els.resultCorrect.textContent = correctNum;
      els.resultIncorrect.textContent = incorrectNum;
      els.resultRate.textContent = `${rate}%`;

      // 不正解だった国の一覧バッジ生成
      els.incorrectCountriesList.innerHTML = '';
      if (incorrectNum > 0) {
        els.incorrectListWrapper.classList.remove('hidden');
        incorrectIdsInRound.forEach(id => {
          const badge = document.createElement('span');
          badge.className = 'px-2.5 py-1 bg-white border border-rose-200 text-rose-700 text-xs font-bold rounded-lg shadow-xs';
          badge.textContent = AFRICA_COUNTRIES[id].ja;
          els.incorrectCountriesList.appendChild(badge);
        });
      } else {
        els.incorrectListWrapper.classList.add('hidden');
      }

      if (incorrectNum === 0) {
        els.modalTitle.textContent = 'パーフェクト達成！';
        els.modalSubtitle.textContent = 'すべての問題に正解しました！素晴らしい地理マスターです！';
        els.modalIconBg.className = 'w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4';
        els.btnRetryIncorrect.classList.add('hidden');
      } else {
        els.modalTitle.textContent = 'ラウンド終了！';
        els.modalSubtitle.textContent = `あと ${incorrectNum} カ国で全問正解です！復習しましょう。`;
        els.modalIconBg.className = 'w-16 h-16 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4';
        els.retryIncorrectCount.textContent = incorrectNum;
        els.btnRetryIncorrect.classList.remove('hidden');
      }

      // 地域フィルター選択中は「この地域でもう一度プレイ」ボタンも表示
      if (state.selectedRegion !== 'all') {
        els.btnRestartCurrentRegion.classList.remove('hidden');
      } else {
        els.btnRestartCurrentRegion.classList.add('hidden');
      }

      // 復習ボタン用に不正解リストを保持
      els.btnRetryIncorrect.dataset.incorrectIds = JSON.stringify(incorrectIdsInRound);
      els.completeModal.classList.remove('hidden');
    }

    /**
     * 特定の国・島国にスムーズにズームフォーカスする
     */
    function focusOnCountry(countryId) {
      const feature = state.features.find(f => f.normalizedId === countryId);
      const info = AFRICA_COUNTRIES[countryId];
      if (!feature || !state.svg || !state.zoom) return;

      let x, y, scale;
      if (info && info.coords) {
        const projected = state.projection(info.coords);
        x = projected[0];
        y = projected[1];
        scale = 4.8;
      } else {
        const bounds = state.pathGenerator.bounds(feature);
        const dx = bounds[1][0] - bounds[0][0];
        const dy = bounds[1][1] - bounds[0][1];
        x = (bounds[0][0] + bounds[1][0]) / 2;
        y = (bounds[0][1] + bounds[1][1]) / 2;
        scale = Math.max(2.0, Math.min(5.5, 0.35 / Math.max(dx / state.width, dy / state.height)));
      }

      const translate = [state.width / 2 - scale * x, state.height / 2 - scale * y];

      state.svg.transition()
        .duration(650)
        .call(state.zoom.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
    }

    /**
     * 地図のズームを初期位置（全体表示）に戻す
     */
    function resetZoom(animated = true) {
      if (!state.svg || !state.zoom) return;
      if (animated) {
        state.svg.transition()
          .duration(500)
          .call(state.zoom.transform, d3.zoomIdentity);
      } else {
        state.svg.call(state.zoom.transform, d3.zoomIdentity);
      }
    }

    /**
     * ヘッダーのステータス表示（残り問題数・正解数・不正解数）を更新
     */
    function updateStatusUI() {
      let correctCount = 0;
      let incorrectCount = 0;

      state.answers.forEach(status => {
        if (status === 'correct') correctCount++;
        else if (status === 'incorrect') incorrectCount++;
      });

      els.correctCountText.textContent = correctCount;
      els.incorrectCountText.textContent = incorrectCount;
    }

    /**
     * 配列のシャッフル（Fisher-Yates）
     */
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * イベントリスナー＆キーボードショートカット登録
     */
    function setupEventListeners() {
      // 答えを表示ボタン
      els.btnShowAnswer.addEventListener('click', revealAnswer);

      // 自己採点ボタン（正解・不正解）
      els.btnMarkCorrect.addEventListener('click', () => recordSelfGrade(true));
      els.btnMarkIncorrect.addEventListener('click', () => recordSelfGrade(false));

      // 前の問題に戻るボタン
      els.btnPrevQuestion.addEventListener('click', goToPreviousQuestion);

      // ヒント表示切替
      els.btnToggleHint.addEventListener('click', () => {
        const region = els.hintBox.dataset.region || '-';
        const capital = els.hintBox.dataset.capital || '-';
        els.hintBox.innerHTML = `<span class="font-bold text-amber-800">${region}</span> <span class="text-slate-400">/</span> <span class="text-slate-700">首都: <strong>${capital}</strong></span>`;
        els.btnToggleHint.classList.add('hidden');
      });

      // 地図表示リセットボタン
      els.btnResetView.addEventListener('click', () => resetZoom(true));

      // 地域フィルター変更時
      els.regionFilter.addEventListener('change', (e) => {
        state.selectedRegion = e.target.value;
        startNewRound(null);
      });

      // 最初からリセットボタン
      els.btnResetProgress.addEventListener('click', () => {
        startNewRound(null);
      });

      // リザルトモーダル：前回不正解だった問題のみで再挑戦
      els.btnRetryIncorrect.addEventListener('click', () => {
        try {
          const incorrectList = JSON.parse(els.btnRetryIncorrect.dataset.incorrectIds || '[]');
          if (incorrectList.length > 0) {
            startNewRound(incorrectList);
          }
        } catch (e) {
          console.error(e);
        }
      });

      // リザルトモーダル：選択中の地域でもう一度プレイ
      els.btnRestartCurrentRegion.addEventListener('click', () => {
        startNewRound(null);
      });

      // リザルトモーダル：全54カ国で最初からプレイ
      els.btnRestartAll.addEventListener('click', () => {
        state.selectedRegion = 'all';
        els.regionFilter.value = 'all';
        startNewRound(null);
      });

      // キーボードショートカット対応
      window.addEventListener('keydown', (e) => {
        // フォーム要素フォーカス時やモーダル表示中は無効化
        if (['SELECT', 'INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (!els.completeModal.classList.contains('hidden')) return;

        if (e.code === 'Space' || e.code === 'Enter') {
          if (!state.isAnswerRevealed) {
            e.preventDefault();
            revealAnswer();
          }
        } else if (e.key === '1' || e.code === 'ArrowLeft') {
          if (state.isAnswerRevealed) {
            e.preventDefault();
            recordSelfGrade(true);
          }
        } else if (e.key === '2' || e.code === 'ArrowRight') {
          if (state.isAnswerRevealed) {
            e.preventDefault();
            recordSelfGrade(false);
          }
        } else if (e.code === 'Backspace' || e.key.toLowerCase() === 'z') {
          if (state.currentIndex > 0) {
            e.preventDefault();
            goToPreviousQuestion();
          }
        }
      });

      // ウィンドウリサイズ時のSVG再調整
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (state.features.length > 0) {
            renderMap();
            const currentId = state.sequence[state.currentIndex] || null;
            updateMapColors(currentId);
          }
        }, 250);
      });
    }

    // アプリ開始
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
